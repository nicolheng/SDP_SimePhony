# Knowledge base sources: the only documents the KB is allowed to quote.
# Every rule (tolerances.yaml) and repair method (repair_methods.yaml) must name one of these ids.
# Changes need a PR, like rules.yaml.
#
# authority (strongest first):
#   law                 Malaysian statute or regulation. Decides valid / invalid.
#   industry_standard   Malaysian industry standard (CIDB). Strong, but only binding if the contract adopts it.
#   intl_reference      Overseas guide. A benchmark only: always say "international reference,
#                       not a Malaysian contractual standard".
#   manufacturer_guide  A product maker's technical advice. Used for repair steps only, never for limits.
#
# licence (what we may store):
#   public_law                 statute text, free to quote
#   free_public                free public document, quote with citation
#   cc_by_3.0                  may copy text, with attribution
#   copyright_paraphrase_only  store our own paraphrase + the number + citation, never the original text
#
# verified: false until #121 checks the link and every number we take from it against the document itself.

version: 1

sources:
  - id: HDR-1989-SPA
    title: Housing Development (Control and Licensing) Regulations 1989, Schedules G, H, I and J (statutory sale and purchase agreements)
    edition: "1989, as amended"
    publisher: Government of Malaysia (KPKT)
    url: https://www.leepartners.my/wp-content/uploads/2016/08/HOUSING_DEVELOPMENT_CONTROL_AND_LICENSING_-REG.pdf
    authority: law
    licence: public_law
    verified: false
    used_for: [defect_period, exclusions]
    notes: >-
      The defect liability period (DLP) clause: 24 months from vacant possession; the developer repairs defects
      caused by workmanship, materials or not following the plans within 30 days of notice.
      Clause 27 in Schedules G/I (landed), clause 30 in H/J (strata). The link is a 2016 law-firm copy;
      check the clause text against the gazette.

  - id: HDA-1966
    title: Housing Development (Control and Licensing) Act 1966 (Act 118)
    edition: "as amended"
    publisher: Government of Malaysia (AGC)
    url: https://lom.agc.gov.my
    authority: law
    licence: public_law
    verified: false
    used_for: [defect_period]
    notes: >-
      Part IIIA ss 16M-16O: Tribunal for Homebuyer Claims (RM50k cap; file within 12 months of CCC/VP
      or of DLP expiry). Exact URL of the act not yet found.

  - id: CIS7-2021
    title: "CIS 7:2021 Quality Assessment System for Building Construction Work (QLASSIC)"
    edition: "2021"
    publisher: CIDB Malaysia
    url: https://www.cream.my/data/cms/files/CIS7%202021.pdf
    authority: industry_standard
    licence: free_public
    verified: false
    used_for: [tolerances]
    notes: >-
      Main Malaysian source for numbers: 1 mm tile lippage, 3 mm per 1.2 m evenness, 5 mm door gaps,
      hollowness by tapping rod, leakage = any uncontrolled water except condensation.
      It is a rating tool, "not intended to be used as specification" unless the contract adopts it.
      No crack-width, ponding or paint rule.

  - id: ST-ESR-2024
    title: Electricity Supply Regulations 2024
    edition: "2024"
    publisher: Suruhanjaya Tenaga (Energy Commission)
    url: https://ecos.gov.my/sites/default/files/uploads/para/attachments/2024-01/1.%20ELECTRICITY%20SUPPLY%20REGULATIONS%202024.pdf
    authority: law
    licence: public_law
    verified: false
    used_for: [repair_methods]
    notes: Only licensed or registered persons may do electrical installation work ("licensed electrician only").

  - id: VIC-BPC-2026
    title: Guide to Standards and Tolerances 2026
    edition: "2026 (applies from 1 Aug 2026)"
    publisher: Building and Plumbing Commission, Victoria (Australia)
    url: https://www.bpc.vic.gov.au/__data/assets/pdf_file/0025/28339/BUI-QRG-001-BPC-Guide-to-Standards-and-Tolerances.pdf
    authority: intl_reference
    licence: copyright_paraphrase_only
    verified: false
    used_for: [tolerances]
    notes: >-
      Fallback numbers where CIS 7 is silent: cracks, ponding, plaster. Also the viewing rule
      (judge from 1.5 m or more in normal light). May only be reproduced unmodified, so we paraphrase.

  - id: NZ-MBIE-2015
    title: Guide to tolerances, materials and workmanship in new residential construction
    edition: "2015"
    publisher: Ministry of Business, Innovation and Employment (New Zealand)
    url: https://building.govt.nz/assets/Uploads/projects-and-consents/guide-to-tolerances/guide-to-tolerances.pdf
    authority: intl_reference
    licence: cc_by_3.0
    verified: false
    used_for: [tolerances, exclusions]
    notes: >-
      "Acceptable / not acceptable" pairs per element, and clear examples of what is not a defect
      (owner damage, wear and tear, condensation from occupants). The only openly reusable text found.

  - id: BCA-TILING-GIP
    title: "Good Industry Practices: Ceramic Tiling"
    edition: "3rd edition"
    publisher: Building and Construction Authority (Singapore)
    url: https://bca.gov.sg/publications/EnhancementSeries/others/tile_full.pdf
    authority: intl_reference
    licence: copyright_paraphrase_only
    verified: false
    used_for: [repair_methods]
    notes: >-
      Cause and remedy for hollow, cracked and debonded tiles; curing times (screed and render 7 days,
      concrete 28 days); "tiles and grout alone cannot waterproof a wet area".

  - id: HDB-HOMECARE
    title: Home Care Guide
    edition: "web guide (check date when verifying)"
    publisher: Housing & Development Board (Singapore)
    url: https://www.hdb.gov.sg/managing-my-home/renovation-and-maintenance/home-maintenance/home-care-guide
    authority: intl_reference
    licence: copyright_paraphrase_only
    verified: false
    used_for: [repair_methods]
    notes: Spalling concrete repair sequence; ceiling leaks under toilets fixed by re-screeding.

  - id: BRE-DG251
    title: "BRE Digest 251: Assessment of damage in low-rise buildings"
    edition: "revised 1995"
    publisher: BRE (United Kingdom)
    url: https://bregroup.com/insights/assessing-cracks-in-houses/
    authority: intl_reference
    licence: copyright_paraphrase_only
    verified: false
    used_for: [tolerances]
    notes: >-
      Crack width categories 0-5 (under 0.1 mm up to over 25 mm); 0-2 aesthetic, 3-4 serviceability,
      5 stability. For masonry, not reinforced concrete. The digest is paid; the link is BRE's free summary.

  - id: ARDEX-TB266
    title: "Technical Bulletin TB266: Flood Testing of Ardex Waterproofing Membranes"
    edition: "TB266.001"
    publisher: Ardex (New Zealand)
    url: https://www.ardex.co.nz/pdf/tech%20bulletins/TB266.001_Flood_Testing_of_Ardex_Waterproofing_Membranes.pdf
    authority: manufacturer_guide
    licence: copyright_paraphrase_only
    verified: false
    used_for: [repair_methods]
    notes: >-
      Flood test: water at least 25 mm deep for at least 24 hours, on a membrane cured at least 48 hours.
      Malaysian contractors often use 25-50 mm for 24-48 h (trade practice, not a standard).

  - id: NIPPON-MY-PAINT
    title: Problems and Solutions (paint defects)
    edition: "web guide (check date when verifying)"
    publisher: Nippon Paint Malaysia
    url: https://professional.nipponpaint.com.my/problems-solutions
    authority: manufacturer_guide
    licence: copyright_paraphrase_only
    verified: false
    used_for: [repair_methods]
    notes: Paint failures and efflorescence. Stop the moisture first, then alkali-resisting sealer and 2 top coats.

  - id: SIKA-MY-INJECTION
    title: Injection systems for cracks
    edition: "web page (check date when verifying)"
    publisher: Sika Malaysia
    url: https://mys.sika.com/en/construction/injections.html
    authority: manufacturer_guide
    licence: copyright_paraphrase_only
    verified: false
    used_for: [repair_methods]
    notes: Epoxy injection for dry or structural cracks; polyurethane injection for wet or leaking cracks. Specialist work.

# Never quote these. The loader (#122) refuses any rule or method that names one of them.
withdrawn:
  - id: CIDB-HOMEOWNER-GUIDEBOOK-2014
    title: Quality Guidebook for Homeowners
    publisher: CIDB Malaysia
    withdrawn_on: 2024-11-14
    reason: CIDB retracted it and said citations of it are "unusable and void".
    evidence: https://www.edgeprop.my/content/1911046/cidb-retracts-2014-homeowners-quality-guidebook-%E2%80%98eliminate-further-misunderstandings%E2%80%99

  - id: CIDB-QLASSIC-HOMEBUYERS-2018
    title: QLASSIC Guidelines for Homebuyers
    publisher: CIDB Malaysia
    withdrawn_on: null   # exact date not found; no longer valid since CIS 7:2021
    replaced_by: CIS7-2021
    reason: No longer valid under CIS 7:2021.
    evidence: https://mbam.org.my/wp-content/uploads/2023/03/Article-QA-on-QLASSIC-Defect-Inspector-and-VP.pdf
